<div class="container" #container>
  <!-- Sign Up Form -->
  <div class="form-container sign-up-container">
    <form (ngSubmit)="signup()">
      <img src="assets/images/logo.png">
      <h1>Create Account</h1>

      <input type="text" [(ngModel)]="signupName" name="name" placeholder="Name" />
      <input type="email" [(ngModel)]="signupEmail" name="email" placeholder="Email" />
      <input type="password" [(ngModel)]="signupPassword" name="password" placeholder="Password" />

      <button type="submit">Sign Up</button>
      <div *ngIf="errorMsg" class="error">{{errorMsg}}</div>
    </form>
  </div>


  <!-- Sign In Form -->
  <div class="form-container sign-in-container">
    <form (ngSubmit)="login()">
      <img src="assets/images/logo2.png">
      <h1>Sign in</h1>
      <input type="email" [(ngModel)]="email" placeholder="Email" name="email" />
      <input type="password" [(ngModel)]="password" placeholder="Password" name="password" />
      <a href="#">Forgot your password?</a>
      <button>Sign In</button>
    </form>
  </div>

  <!-- Overlay -->
  <div class="overlay-container">
    <div class="overlay">
      <div class="overlay-panel overlay-left">
        <h1>Welcome Back!</h1>
        <p>Log in to continue your journey to a healthier life.</p>
        <button class="ghost" (click)="toggleSignIn()">Sign In</button>
      </div>
      <div class="overlay-panel overlay-right">
        <h1>Unlock Your Healthier Self.</h1>
        <p>Create a free account to personalize your scans, save your favorites, and get tailored recommendations for a
          healthier lifestyle.</p>
        <button class="ghost" (click)="toggleSignUp()">Sign Up</button>
      </div>
    </div>
  </div>
</div>
